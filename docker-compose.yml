version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # DEBUGGING ONLY: Remove or comment out for production
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005
    volumes:
      - ~/.m2:/root/.m2
      - ./target:/app/target  # Mount only target directory for JAR access
      - ./src:/app/src        # Mount source for potential live reload (if using devtools)
    depends_on:
      postgres:
        condition: service_healthy  # Wait for postgres to be healthy

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=demo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sa"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: